# Docker Compose for local development — PostgreSQL database
# Usage:  docker compose up -d
#         docker compose down        (stop)
#         docker compose down -v     (stop + delete data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: competitor_intel_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: competitor123
      POSTGRES_DB: competitor_intel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d competitor_intel"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
